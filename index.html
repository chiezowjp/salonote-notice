<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Salonote｜新規お申し込みのお休みについて</title>
<meta name="description" content="Salonoteは現在メンテナンス中のため、新規のお申し込みをお休みしています。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%235BC5D1'/%3E%3Ctext x='20' y='25' text-anchor='middle' font-size='24' font-weight='600' fill='white' font-family='system-ui,sans-serif'%3ES%3C/text%3E%3Cpath d='M12 29c3 3.2 13 3.2 16 0' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --brand: #5BC5D1;
    --brand-deep: #2BA9BA;
    --text: #4D4D4D;
    --muted: #7A7A7A;
    --bg: #F4FBFC;
    --card: #FFFFFF;
    --line: #DCEFF2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, system-ui, sans-serif;
    line-height: 1.8;
  }
  main {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 40px 28px;
    text-align: center;
  }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--brand);
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.04em;
  }
  .logo svg { width: 30px; height: 30px; }
  .logo .ote { color: var(--brand-deep); }
  h1 {
    margin: 28px 0 16px;
    font-size: 21px;
    line-height: 1.6;
    color: var(--brand-deep);
  }
  p { margin: 0 0 14px; font-size: 15px; }
  .note {
    margin-top: 24px;
    padding: 16px;
    border-radius: 12px;
    background: var(--bg);
    font-size: 14px;
    text-align: left;
  }
  .note strong { color: var(--brand-deep); }
  .follow {
    display: inline-block;
    margin-top: 24px;
    padding: 12px 24px;
    border-radius: 999px;
    background: var(--brand);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    text-decoration: none;
  }
  .follow:hover { background: var(--brand-deep); }
  footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="logo" aria-label="Salonote（サロノート）">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <text x="20" y="25" text-anchor="middle" font-size="26" font-weight="600" fill="currentColor" font-family="system-ui, sans-serif">S</text>
      <path d="M11 29c3.2 3.4 14.6 3.4 18 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    <span>Salon<span class="ote">ote</span></span>
  </div>

  <h1>ただいま、新規のお申し込みを<br>お休みしています</h1>

  <p>Salonoteは現在メンテナンス中のため、<br>新規のお申し込み（30日間の無料お試しを含む）を<br>一時的にお休みしています。</p>
  <p>再開しましたら、Threadsでお知らせします。<br>お待たせしてしまい、申し訳ありません。</p>

  <div class="note">
    <strong>ご利用中のサロンさまへ</strong><br>
    メンテナンスの内容と再開の予定は、個別にご連絡いたします。
  </div>

  <a class="follow" href="https://www.threads.com/@salonote.jp">Threadsで再開のお知らせを受け取る</a>

  <footer>Salonote（サロノート）｜私のサロンを、もっとかんたんに。</footer>
</main>
</body>
</html>
